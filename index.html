<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMOA Docent Tour Scheduling</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f0;
      color: #2c2c2c;
      line-height: 1.5;
    }

    header {
      background: #1a3a4a;
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    header h1 { font-size: 1.3rem; font-weight: 600; }

    .header-controls select {
      font-size: 0.95rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      min-width: 160px;
    }

    .header-controls select option { color: #333; background: #fff; }

    .header-greeting {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.9);
    }

    .header-greeting a {
      color: rgba(255,255,255,0.7);
      font-size: 0.85rem;
      margin-left: 0.5rem;
    }

    .container { max-width: 700px; margin: 0 auto; padding: 1rem; }

    /* Week navigation */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.6rem 1rem;
    }

    .week-nav button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: #1a3a4a;
    }

    .week-nav button:hover { background: #eee; }
    .week-nav .week-label { font-weight: 600; font-size: 1rem; color: #1a3a4a; }

    /* Filter bar */
    .filter-bar {
      margin-bottom: 0.75rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-bar label { font-size: 0.85rem; color: #666; }

    .filter-bar select {
      font-size: 0.85rem;
      padding: 0.25rem 0.4rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }

    /* Tabs */
    .tabs { display: flex; gap: 2px; margin-bottom: 1rem; flex-wrap: wrap; }

    .tab {
      padding: 0.5rem 1rem;
      border: 1px solid #ddd;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: #e8e8e3;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
    }

    .tab.active {
      background: #fff;
      color: #1a3a4a;
      font-weight: 600;
      border-bottom: 1px solid #fff;
      margin-bottom: -1px;
      position: relative;
      z-index: 1;
    }

    .tab .badge {
      display: inline-block;
      background: #c4713b;
      color: #fff;
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 8px;
      margin-left: 0.3rem;
      font-weight: 600;
    }

    /* Day sections */
    .day-section {
      margin-bottom: 0.75rem;
    }

    .day-header {
      background: #1a3a4a;
      color: #fff;
      padding: 0.45rem 0.75rem;
      border-radius: 6px 6px 0 0;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .day-header.today { background: #2a6a3a; }

    .day-body {
      background: #fff;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 0.5rem;
    }

    .day-empty {
      color: #bbb;
      font-size: 0.85rem;
      font-style: italic;
      padding: 0.25rem 0.5rem;
    }

    /* Tour rows */
    .tour-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.4rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 2px;
      font-size: 0.9rem;
      flex-wrap: wrap;
    }

    .tour-row:last-child { margin-bottom: 0; }

    .tour-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 2px 0 0 0;
      accent-color: #1a3a4a;
      flex-shrink: 0;
    }

    .tour-row.open { background: #f0f5f0; }
    .tour-row.assigned-you { background: #d0e8d0; }
    .tour-row.assigned { background: #f5f5f2; color: #999; }
    .tour-row.needs-sub { background: #fde8d8; }
    .tour-row.urgent { border-left: 3px solid #c4713b; font-weight: 600; }
    .tour-row.uncertified { opacity: 0.5; }

    .tour-time { font-weight: 600; min-width: 70px; flex-shrink: 0; }
    .tour-type { flex: 1; }
    .tour-meta {
      width: 100%;
      font-size: 0.75rem;
      color: #777;
      padding-left: 26px;
      margin-top: -2px;
    }
    .tour-counts {
      font-size: 0.75rem;
      color: #888;
      flex-shrink: 0;
    }
    .tour-counts.needs-more { color: #c4713b; }
    .role-select {
      font-size: 0.75rem;
      padding: 0.15rem 0.3rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      flex-shrink: 0;
    }
    .tour-tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .tag-you { background: #2a6a3a; color: #fff; }
    .tag-filled { background: #ddd; color: #888; }
    .tag-claim {
      background: #c4713b;
      color: #fff;
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 10px;
    }
    .tag-claim:hover { background: #a85a2a; }

    /* List cards */
    .list-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .list-card .lc-info { flex: 1; }
    .list-card .lc-tour { font-weight: 600; color: #1a3a4a; }
    .list-card .lc-date { font-size: 0.9rem; color: #555; }
    .list-card .lc-meta { font-size: 0.8rem; color: #999; }
    .list-card.your-tour { border-left: 3px solid #3a8a3a; }
    .list-card.sub-needed { border-left: 3px solid #c4713b; }
    .list-card.offered-tour { border-left: 3px solid #4a7ab5; }

    /* Buttons */
    .btn { display: inline-block; padding: 0.45rem 1rem; font-size: 0.9rem; border: none; border-radius: 4px; cursor: pointer; font-family: inherit; }
    .btn-primary { background: #1a3a4a; color: #fff; }
    .btn-primary:hover { background: #2a5a6a; }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }
    .btn-claim { background: #c4713b; color: #fff; font-size: 0.85rem; padding: 0.35rem 0.8rem; }
    .btn-claim:hover { background: #a85a2a; }
    .btn-claim:disabled { background: #999; cursor: not-allowed; }

    .save-bar {
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 0.75rem 1.5rem;
      text-align: center;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
      z-index: 10;
    }

    .message { padding: 0.7rem 1rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .message-success { background: #e8f5e8; color: #2a5a2a; border: 1px solid #a8c8a8; }
    .message-error { background: #fde8e8; color: #8a2a2a; border: 1px solid #d4a8a8; }
    .message-info { background: #e8eef5; color: #2a3a5a; border: 1px solid #a8b8d4; }

    .loading { text-align: center; padding: 3rem; color: #888; font-style: italic; }
    .empty-state { text-align: center; color: #999; padding: 2rem; font-style: italic; }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; }
      .header-controls select { width: 100%; }
      .tabs { gap: 1px; }
      .tab { padding: 0.4rem 0.6rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>CMOA Docent Scheduling</h1>
  <div class="header-controls" id="header-controls">
    <select id="docent-select" onchange="selectDocent(this.value)">
      <option value="">-- Pick your name --</option>
    </select>
  </div>
</header>

<div class="container" id="app">
  <div class="loading">Loading schedule...</div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzlIWacNLwGn1Jam5rc3-Y6nVuVhlbZlBjN1Jm-v-c6LzGwx7-hMFGAzIuKvTduUkS2ow/exec';

let currentDocent = localStorage.getItem('cmoa_docent_name') || '';
let allSlots = [];
let allDocents = [];
let docentCertMap = {};
let tourTagMap = {};
let selectedSlots = new Set();
let selectedRoles = {};  // slotId -> 'desk' or 'tour'
let currentWeekStart = getMonday(new Date());
let activeTab = 'calendar';
let tourTypeFilter = '';

function getMonday(d) {
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  return dt;
}

function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

function dateKey(d) {
  const dt = new Date(d);
  return dt.getFullYear() + '-' +
    String(dt.getMonth()+1).padStart(2,'0') + '-' +
    String(dt.getDate()).padStart(2,'0');
}

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fullDate(d) {
  const dt = new Date(d);
  return DAY_NAMES[dt.getDay()] + ', ' + MONTH_NAMES[dt.getMonth()] + ' ' + dt.getDate();
}

function shortDate(d) {
  const dt = new Date(d);
  return SHORT_MONTHS[dt.getMonth()] + ' ' + dt.getDate();
}

function cleanTime(raw) {
  if (!raw) return '';
  const s = String(raw);
  if (/^\d{1,2}:\d{2}\s*(AM|PM)$/i.test(s.trim())) return s.trim();
  const match = s.match(/(\d{1,2}):(\d{2}):\d{2}\s*GMT/);
  if (match) {
    let hour = parseInt(match[1]);
    const min = match[2];
    const ampm = hour >= 12 ? 'PM' : 'AM';
    if (hour > 12) hour -= 12;
    if (hour === 0) hour = 12;
    return hour + ':' + min + ' ' + ampm;
  }
  const d = new Date(s);
  if (!isNaN(d.getTime())) {
    let hour = d.getHours();
    const min = String(d.getMinutes()).padStart(2, '0');
    const ampm = hour >= 12 ? 'PM' : 'AM';
    if (hour > 12) hour -= 12;
    if (hour === 0) hour = 12;
    return hour + ':' + min + ' ' + ampm;
  }
  return s;
}

function isCertifiedFor(docentName, tourType) {
  const certs = docentCertMap[docentName];
  if (!certs) return true;
  const requiredTag = tourTagMap[tourType.toLowerCase()];
  if (!requiredTag) return true;
  return certs.indexOf(requiredTag) !== -1;
}

document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
  try {
    const resp = await fetch(WEB_APP_URL);
    const data = await resp.json();
    allDocents = data.docents || [];
    allSlots = data.slots || [];
    tourTagMap = data.tourTagMap || {};

    allSlots.forEach(s => { s.time = cleanTime(s.time); });

    // Build certification lookup
    docentCertMap = {};
    const docentNames = [];
    allDocents.forEach(d => {
      const name = (typeof d === 'string') ? d : d.name;
      const certs = (typeof d === 'string') ? null : d.certifiedTours;
      docentNames.push(name);
      docentCertMap[name] = certs;
    });

    // Validate stored name still exists
    if (currentDocent && docentNames.indexOf(currentDocent) === -1) {
      currentDocent = '';
      localStorage.removeItem('cmoa_docent_name');
    }

    // Build dropdown (hidden when name is set, but keep it populated)
    const sel = document.getElementById('docent-select');
    sel.innerHTML = '<option value="">-- Pick your name --</option>';
    docentNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (name === currentDocent) opt.selected = true;
      sel.appendChild(opt);
    });

    updateHeaderControls();
    render();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="message message-error">Could not load schedule. Please try refreshing.</div>';
  }
}

function updateHeaderControls() {
  const controls = document.getElementById('header-controls');
  if (currentDocent) {
    controls.innerHTML = '<span class="header-greeting">Welcome, <strong>' + escapeHtml(currentDocent) +
      '</strong> <a href="#" onclick="changeName(); return false;">Not you? Change</a></span>';
  } else {
    controls.innerHTML = '<select id="docent-select" onchange="selectDocent(this.value)">' +
      '<option value="">-- Pick your name --</option></select>';
    const sel = controls.querySelector('select');
    const docentNames = allDocents.map(d => (typeof d === 'string') ? d : d.name);
    docentNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sel.appendChild(opt);
    });
  }
}

function changeName() {
  currentDocent = '';
  localStorage.removeItem('cmoa_docent_name');
  updateHeaderControls();
  render();
}

function selectDocent(name) {
  currentDocent = name;
  if (name) {
    localStorage.setItem('cmoa_docent_name', name);
  } else {
    localStorage.removeItem('cmoa_docent_name');
  }
  updateHeaderControls();
  render();
}

function render() {
  const app = document.getElementById('app');

  if (!currentDocent) {
    app.innerHTML = '<div class="message message-info">Pick your name above to see the schedule and sign up for tours.</div>';
    removeSaveBar();
    return;
  }

  const openSlots = allSlots.filter(s => s.status === '' || s.status === 'Open');
  const needsSubSlots = allSlots.filter(s => s.status === 'Needs Sub');
  const assignedSlots = allSlots.filter(s => s.status === 'Assigned');
  const myTours = assignedSlots.filter(s => s.assigned.indexOf(currentDocent) !== -1);
  const offeredSlots = openSlots.filter(s => s.signups.indexOf(currentDocent) !== -1);

  selectedSlots = new Set();
  selectedRoles = {};
  openSlots.forEach(s => {
    if (s.signups.indexOf(currentDocent) !== -1) {
      selectedSlots.add(s.slotId);
      // Check if this is a role-based signup
      if (s.roleSignups) {
        if (s.roleSignups.desk && s.roleSignups.desk.indexOf(currentDocent) !== -1) {
          selectedRoles[s.slotId] = 'desk';
        } else if (s.roleSignups.tour && s.roleSignups.tour.indexOf(currentDocent) !== -1) {
          selectedRoles[s.slotId] = 'tour';
        } else if (s.roleSignups.lead && s.roleSignups.lead.indexOf(currentDocent) !== -1) {
          selectedRoles[s.slotId] = 'lead';
        } else if (s.roleSignups.participant && s.roleSignups.participant.indexOf(currentDocent) !== -1) {
          selectedRoles[s.slotId] = 'participant';
        }
      }
    }
  });

  let html = '<div id="message-area"></div>';

  // Tabs
  html += '<div class="tabs">';
  html += '<div class="tab' + (activeTab === 'calendar' ? ' active' : '') + '" onclick="switchTab(\'calendar\')">Weekly View</div>';
  html += '<div class="tab' + (activeTab === 'mytours' ? ' active' : '') + '" onclick="switchTab(\'mytours\')">Your Tours' +
           (myTours.length ? ' <span class="badge">' + myTours.length + '</span>' : '') + '</div>';
  html += '<div class="tab' + (activeTab === 'offered' ? ' active' : '') + '" onclick="switchTab(\'offered\')">Offered' +
           (offeredSlots.length ? ' <span class="badge">' + offeredSlots.length + '</span>' : '') + '</div>';
  if (needsSubSlots.length > 0) {
    html += '<div class="tab' + (activeTab === 'subs' ? ' active' : '') + '" onclick="switchTab(\'subs\')">Needs Sub <span class="badge">' + needsSubSlots.length + '</span></div>';
  }
  html += '</div>';

  if (activeTab === 'calendar') {
    html += renderWeek(openSlots, assignedSlots, needsSubSlots);
  } else if (activeTab === 'mytours') {
    html += renderMyTours(myTours);
  } else if (activeTab === 'offered') {
    html += renderOffered(offeredSlots);
  } else if (activeTab === 'subs') {
    html += renderNeedsSub(needsSubSlots);
  }

  app.innerHTML = html;

  if (activeTab === 'calendar' && openSlots.length > 0) {
    showSaveBar();
  } else {
    removeSaveBar();
  }
}

function renderWeek(openSlots, assignedSlots, needsSubSlots) {
  const weekEnd = addDays(currentWeekStart, 6);
  const todayStr = dateKey(new Date());
  const todayMs = new Date().setHours(0,0,0,0);

  // Collect unique tour types for filter
  const tourTypes = new Set();
  allSlots.forEach(s => { if (s.tourType) tourTypes.add(s.tourType); });

  // Build slot map by date
  const slotsByDate = {};
  [...openSlots, ...assignedSlots, ...needsSubSlots].forEach(s => {
    if (!slotsByDate[s.date]) slotsByDate[s.date] = [];
    slotsByDate[s.date].push(s);
  });

  let html = '';

  // Week nav
  html += '<div class="week-nav">';
  html += '<button onclick="prevWeek()">&larr; Prev</button>';
  html += '<span class="week-label">' + shortDate(currentWeekStart) + ' &ndash; ' + shortDate(weekEnd) + '</span>';
  html += '<button onclick="nextWeek()">Next &rarr;</button>';
  html += '</div>';

  // Tour type filter
  html += '<div class="filter-bar">';
  html += '<label>Filter:</label>';
  html += '<select onchange="setTourFilter(this.value)">';
  html += '<option value="">All tour types</option>';
  Array.from(tourTypes).sort().forEach(t => {
    html += '<option value="' + escapeHtml(t) + '"' + (tourTypeFilter === t ? ' selected' : '') + '>' + escapeHtml(t) + '</option>';
  });
  html += '</select>';
  html += '</div>';

  // Day-by-day vertical layout
  for (let i = 0; i < 7; i++) {
    const day = addDays(currentWeekStart, i);
    const dk = dateKey(day);
    const isToday = dk === todayStr;
    let daySlots = slotsByDate[dk] || [];

    // Apply tour type filter
    if (tourTypeFilter) {
      daySlots = daySlots.filter(s => s.tourType === tourTypeFilter);
    }

    daySlots.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    html += '<div class="day-section">';
    html += '<div class="day-header' + (isToday ? ' today' : '') + '">' + fullDate(day) + (isToday ? ' (Today)' : '') + '</div>';
    html += '<div class="day-body">';

    if (daySlots.length === 0) {
      html += '<div class="day-empty">No tours scheduled</div>';
    } else {
      daySlots.forEach(slot => {
        const isOpen = slot.status === '' || slot.status === 'Open';
        const isAssigned = slot.status === 'Assigned';
        const isYours = isAssigned && slot.assigned.indexOf(currentDocent) !== -1;
        const isSub = slot.status === 'Needs Sub';
        const checked = selectedSlots.has(slot.slotId);
        const certified = isCertifiedFor(currentDocent, slot.tourType);

        // Urgency: open, within 7 days, needs more docents
        const slotDate = new Date(slot.date + 'T00:00:00');
        const daysOut = (slotDate - todayMs) / 86400000;
        const needsMore = slot.signups.length < slot.docentsNeeded;
        const isUrgent = isOpen && daysOut <= 7 && daysOut >= 0 && needsMore;

        let rowClass = 'open';
        if (isYours) rowClass = 'assigned-you';
        else if (isAssigned) rowClass = 'assigned';
        else if (isSub) rowClass = 'needs-sub';
        if (isUrgent) rowClass += ' urgent';
        if (isOpen && !certified) rowClass += ' uncertified';

        html += '<div class="tour-row ' + rowClass + '">';

        const hasMindfulRoles = (slot.docentsNeeded_Desk > 0 || slot.docentsNeeded_MindfulTour > 0);
        const hasSchoolRoles = (slot.docentsNeeded_Lead > 0 || slot.docentsNeeded_Participant > 0);
        const hasRoles = hasMindfulRoles || hasSchoolRoles;

        if (isOpen) {
          html += '<input type="checkbox" value="' + slot.slotId + '"' +
            (checked ? ' checked' : '') +
            (!certified ? ' disabled title="Requires certification"' : '') +
            ' onchange="toggleSlot(this)">';

          // Role selector
          if (hasRoles && certified) {
            const curRole = selectedRoles[slot.slotId] || '';
            html += '<select class="role-select" data-slot="' + slot.slotId + '" onchange="setRole(this)"' +
              (!checked ? ' style="display:none"' : '') + '>' +
              '<option value="">-- Role --</option>';
            if (hasMindfulRoles) {
              html += '<option value="desk"' + (curRole === 'desk' ? ' selected' : '') + '>Welcome Desk</option>' +
                '<option value="tour"' + (curRole === 'tour' ? ' selected' : '') + '>Tour</option>';
            }
            if (hasSchoolRoles) {
              html += '<option value="lead"' + (curRole === 'lead' ? ' selected' : '') + '>Lead</option>' +
                '<option value="participant"' + (curRole === 'participant' ? ' selected' : '') + '>Participant</option>';
            }
            html += '</select>';
          }
        }

        html += '<span class="tour-time">' + escapeHtml(slot.time) + '</span>';
        html += '<span class="tour-type">' + escapeHtml(slot.tourType) + '</span>';

        // Counts
        if (isOpen) {
          if (hasMindfulRoles) {
            const deskSignups = (slot.roleSignups && slot.roleSignups.desk) ? slot.roleSignups.desk.length : 0;
            const tourSignups = (slot.roleSignups && slot.roleSignups.tour) ? slot.roleSignups.tour.length : 0;
            html += '<span class="tour-counts' + (deskSignups < slot.docentsNeeded_Desk || tourSignups < slot.docentsNeeded_MindfulTour ? ' needs-more' : '') + '">' +
              'Desk: ' + deskSignups + '/' + slot.docentsNeeded_Desk +
              ' Tour: ' + tourSignups + '/' + slot.docentsNeeded_MindfulTour + '</span>';
          } else if (hasSchoolRoles) {
            const leadSignups = (slot.roleSignups && slot.roleSignups.lead) ? slot.roleSignups.lead.length : 0;
            const partSignups = (slot.roleSignups && slot.roleSignups.participant) ? slot.roleSignups.participant.length : 0;
            html += '<span class="tour-counts' + (leadSignups < slot.docentsNeeded_Lead || partSignups < slot.docentsNeeded_Participant ? ' needs-more' : '') + '">' +
              'Lead: ' + leadSignups + '/' + slot.docentsNeeded_Lead +
              ' Participant: ' + partSignups + '/' + slot.docentsNeeded_Participant + '</span>';
          } else {
            const n = slot.signups.length;
            const needed = slot.docentsNeeded;
            if (n >= needed) {
              html += '<span class="tour-counts">' + n + ' of ' + needed + ' available</span>';
            } else {
              const remaining = needed - n;
              html += '<span class="tour-counts needs-more">needs ' + remaining + ' more</span>';
            }
          }
        } else if (isYours) {
          html += '<span class="tour-tag tag-you">YOU</span>';
        } else if (isAssigned) {
          html += '<span class="tour-tag tag-filled">Filled</span>';
        } else if (isSub) {
          html += '<button class="tag-claim" onclick="claimSlot(\'' + slot.slotId + '\', this)">Claim</button>';
        }

        // Tour metadata (second line)
        let meta = [];
        if (slot.details) meta.push(slot.details);
        if (meta.length > 0) {
          html += '<div class="tour-meta">' + escapeHtml(meta.join(' | ')) + '</div>';
        }

        html += '</div>';
      });
    }

    html += '</div></div>';
  }

  return html;
}

function renderMyTours(myTours) {
  if (myTours.length === 0) {
    return '<div class="empty-state">You have no assigned tours yet. Sign up on the Weekly View and the system will assign you automatically.</div>';
  }
  let html = '';
  myTours.forEach(slot => {
    html += '<div class="list-card your-tour">';
    html += '<div class="lc-info">';
    html += '<div class="lc-tour">' + escapeHtml(slot.tourType) + '</div>';
    html += '<div class="lc-date">' + escapeHtml(slot.dateDisplay) + ' at ' + escapeHtml(slot.time) + '</div>';

    // Show metadata if present
    let meta = [];
    if (slot.focusArea) meta.push(slot.focusArea);
    if (slot.tourAgesGrades) meta.push(slot.tourAgesGrades);
    if (meta.length > 0) {
      html += '<div class="lc-meta">' + escapeHtml(meta.join(' | ')) + '</div>';
    }

    // Show roles if present
    let roles = [];
    if (slot.tourLeadSchool) roles.push('Tour Lead: ' + slot.tourLeadSchool);
    if (slot.participantSchool) roles.push('Participants: ' + slot.participantSchool);
    if (slot.mindfulWelcomeDesk) roles.push('Welcome Desk: ' + slot.mindfulWelcomeDesk);
    if (slot.mindfulTourLead) roles.push('Tour Lead: ' + slot.mindfulTourLead);
    if (roles.length > 0) {
      html += '<div class="lc-meta">' + roles.map(escapeHtml).join(' &bull; ') + '</div>';
    } else {
      html += '<div class="lc-meta">Check your calendar for reminders</div>';
    }

    html += '</div></div>';
  });
  return html;
}

function renderOffered(offeredSlots) {
  if (offeredSlots.length === 0) {
    return '<div class="empty-state">You haven\'t offered availability for any tours yet. Go to the Weekly View to sign up.</div>';
  }
  let html = '';
  offeredSlots.forEach(slot => {
    const n = slot.signups.length;
    const needed = slot.docentsNeeded;
    html += '<div class="list-card offered-tour">';
    html += '<div class="lc-info">';
    html += '<div class="lc-tour">' + escapeHtml(slot.tourType) + '</div>';
    html += '<div class="lc-date">' + escapeHtml(slot.dateDisplay) + ' at ' + escapeHtml(slot.time) + '</div>';
    html += '<div class="lc-meta">' + n + ' of ' + needed + ' available &mdash; pending assignment</div>';
    html += '</div></div>';
  });
  return html;
}

function renderNeedsSub(needsSubSlots) {
  if (needsSubSlots.length === 0) {
    return '<div class="empty-state">No openings right now.</div>';
  }
  let html = '';
  needsSubSlots.forEach(slot => {
    html += '<div class="list-card sub-needed">';
    html += '<div class="lc-info">';
    html += '<div class="lc-tour">' + escapeHtml(slot.tourType) + '</div>';
    html += '<div class="lc-date">' + escapeHtml(slot.dateDisplay) + ' at ' + escapeHtml(slot.time) + '</div>';

    let meta = [];
    if (slot.focusArea) meta.push(slot.focusArea);
    if (slot.tourAgesGrades) meta.push(slot.tourAgesGrades);
    if (meta.length > 0) {
      html += '<div class="lc-meta">' + escapeHtml(meta.join(' | ')) + '</div>';
    }

    html += '</div>';
    html += '<button class="btn btn-claim" onclick="claimSlot(\'' + slot.slotId + '\', this)">Claim</button>';
    html += '</div>';
  });
  return html;
}

function switchTab(tab) { activeTab = tab; render(); }
function prevWeek() { currentWeekStart = addDays(currentWeekStart, -7); render(); }
function nextWeek() { currentWeekStart = addDays(currentWeekStart, 7); render(); }
function setTourFilter(val) { tourTypeFilter = val; render(); }

function toggleSlot(checkbox) {
  const slotId = checkbox.value;
  if (checkbox.checked) {
    selectedSlots.add(slotId);
  } else {
    selectedSlots.delete(slotId);
    delete selectedRoles[slotId];
  }
  // Show/hide role selector if present
  const roleSelect = checkbox.parentElement.querySelector('.role-select');
  if (roleSelect) {
    roleSelect.style.display = checkbox.checked ? '' : 'none';
    if (!checkbox.checked) roleSelect.value = '';
  }
}

function setRole(selectEl) {
  const slotId = selectEl.getAttribute('data-slot');
  if (selectEl.value) {
    selectedRoles[slotId] = selectEl.value;
  } else {
    delete selectedRoles[slotId];
  }
}

function showSaveBar() {
  let bar = document.getElementById('save-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'save-bar';
    bar.className = 'save-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = '<button class="btn btn-primary" id="save-btn" onclick="saveSignups()">Save My Availability</button>';
  bar.style.display = 'block';
}

function removeSaveBar() {
  const bar = document.getElementById('save-bar');
  if (bar) bar.style.display = 'none';
}

async function saveSignups() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'signup', docent: currentDocent, slots: Array.from(selectedSlots), roles: selectedRoles })
    });
    const result = await resp.json();
    if (result.ok) {
      showMessage('Your availability has been saved.', 'success');
      await loadData();
    } else {
      showMessage(result.error || 'Something went wrong. Please try again.', 'error');
    }
  } catch (err) {
    showMessage('Could not save. Check your internet connection and try again.', 'error');
  }
  btn.disabled = false;
  btn.textContent = 'Save My Availability';
}

async function claimSlot(slotId, el) {
  if (!confirm('Claim this tour? You will receive a calendar invite.')) return;
  if (el.tagName === 'BUTTON') { el.disabled = true; el.textContent = '...'; }
  try {
    const resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'claim', slot: slotId, docent: currentDocent })
    });
    const result = await resp.json();
    if (result.ok) {
      showMessage('Tour claimed! A calendar invite is on its way.', 'success');
    } else {
      showMessage(result.error || 'Could not claim. Someone may have gotten there first.', 'error');
    }
    await loadData();
  } catch (err) {
    showMessage('Could not claim. Please try again.', 'error');
  }
}

function showMessage(text, type) {
  const area = document.getElementById('message-area');
  if (!area) return;
  area.innerHTML = '<div class="message message-' + type + '">' + escapeHtml(text) + '</div>';
  setTimeout(() => { area.innerHTML = ''; }, 5000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
