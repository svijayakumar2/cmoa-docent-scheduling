<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMOA Docent Tour Scheduling</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f0;
      color: #2c2c2c;
      line-height: 1.5;
    }

    header {
      background: #1a3a4a;
      color: #fff;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-controls select {
      font-size: 0.95rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      min-width: 160px;
    }

    .header-controls select option { color: #333; background: #fff; }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem;
    }

    /* Week navigation */
    .week-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 0.6rem 1rem;
    }

    .week-nav button {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: #1a3a4a;
    }

    .week-nav button:hover { background: #eee; }

    .week-nav .week-label {
      font-weight: 600;
      font-size: 1rem;
      color: #1a3a4a;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 1rem;
    }

    .tab {
      padding: 0.5rem 1rem;
      border: 1px solid #ddd;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: #e8e8e3;
      cursor: pointer;
      font-size: 0.9rem;
      color: #666;
    }

    .tab.active {
      background: #fff;
      color: #1a3a4a;
      font-weight: 600;
      border-bottom: 1px solid #fff;
      margin-bottom: -1px;
      position: relative;
      z-index: 1;
    }

    .tab .badge {
      display: inline-block;
      background: #c4713b;
      color: #fff;
      font-size: 0.7rem;
      padding: 0.1rem 0.4rem;
      border-radius: 8px;
      margin-left: 0.3rem;
      font-weight: 600;
    }

    /* Calendar grid */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: #ddd;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .cal-header {
      background: #1a3a4a;
      color: #fff;
      padding: 0.5rem;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .cal-day {
      background: #fff;
      min-height: 120px;
      padding: 0.4rem;
      vertical-align: top;
    }

    .cal-day.empty {
      background: #f9f9f6;
    }

    .cal-day.today {
      background: #fffde8;
    }

    .cal-day-number {
      font-size: 0.8rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 0.3rem;
    }

    .cal-day.today .cal-day-number { color: #1a3a4a; }

    /* Tour pills inside calendar cells */
    .tour-pill {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.35rem;
      margin-bottom: 2px;
      border-radius: 4px;
      font-size: 0.7rem;
      line-height: 1.3;
      cursor: default;
    }

    .tour-pill input[type="checkbox"] {
      width: 13px;
      height: 13px;
      margin: 0;
      accent-color: #1a3a4a;
      flex-shrink: 0;
    }

    .tour-pill.open { background: #e8f0e8; color: #2a5a2a; }
    .tour-pill.assigned-you { background: #c8e0c8; color: #1a4a1a; font-weight: 600; }
    .tour-pill.assigned { background: #eee; color: #888; }
    .tour-pill.needs-sub { background: #fde8d8; color: #8a4a2a; }

    .tour-pill .pill-time { font-weight: 600; white-space: nowrap; }
    .tour-pill .pill-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* List view (for "Your Tours" and "Needs Sub" tabs) */
    .list-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .list-card .lc-info { flex: 1; }
    .list-card .lc-tour { font-weight: 600; color: #1a3a4a; font-size: 0.95rem; }
    .list-card .lc-date { font-size: 0.9rem; color: #555; }
    .list-card .lc-meta { font-size: 0.8rem; color: #999; }

    .list-card.your-tour { border-left: 3px solid #3a8a3a; }
    .list-card.sub-needed { border-left: 3px solid #c4713b; }

    /* Buttons */
    .btn {
      display: inline-block;
      padding: 0.45rem 1rem;
      font-size: 0.9rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary { background: #1a3a4a; color: #fff; }
    .btn-primary:hover { background: #2a5a6a; }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }

    .btn-claim { background: #c4713b; color: #fff; font-size: 0.85rem; padding: 0.35rem 0.8rem; }
    .btn-claim:hover { background: #a85a2a; }
    .btn-claim:disabled { background: #999; cursor: not-allowed; }

    .save-bar {
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #ddd;
      padding: 0.75rem 1.5rem;
      text-align: center;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
      z-index: 10;
    }

    /* Messages */
    .message {
      padding: 0.7rem 1rem;
      border-radius: 6px;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    .message-success { background: #e8f5e8; color: #2a5a2a; border: 1px solid #a8c8a8; }
    .message-error { background: #fde8e8; color: #8a2a2a; border: 1px solid #d4a8a8; }
    .message-info { background: #e8eef5; color: #2a3a5a; border: 1px solid #a8b8d4; }

    .loading { text-align: center; padding: 3rem; color: #888; font-style: italic; }
    .empty-state { text-align: center; color: #999; padding: 2rem; font-style: italic; }

    @media (max-width: 700px) {
      .calendar { grid-template-columns: 1fr; }
      .cal-header { display: none; }
      .cal-day { min-height: auto; padding: 0.5rem; }
      .cal-day.empty { display: none; }
      .cal-day-number { font-size: 0.9rem; }
      .tour-pill { font-size: 0.8rem; padding: 0.3rem 0.5rem; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <h1>CMOA Docent Scheduling</h1>
  <div class="header-controls">
    <select id="docent-select" onchange="selectDocent(this.value)">
      <option value="">-- Pick your name --</option>
    </select>
  </div>
</header>

<div class="container" id="app">
  <div class="loading">Loading schedule...</div>
</div>

<script>
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyeS0KVolEfQLUxoL1pyj5vmejqyZpDg7O4dRF7xIlL3E8hbz4p62m0Z2HwymLlKjlNtA/exec';

let currentDocent = '';
let allSlots = [];
let allDocents = [];
let selectedSlots = new Set();
let currentWeekStart = getMonday(new Date());
let activeTab = 'calendar';

function getMonday(d) {
  const dt = new Date(d);
  dt.setHours(0,0,0,0);
  const day = dt.getDay();
  const diff = dt.getDate() - day + (day === 0 ? -6 : 1);
  dt.setDate(diff);
  return dt;
}

function addDays(d, n) {
  const dt = new Date(d);
  dt.setDate(dt.getDate() + n);
  return dt;
}

function dateKey(d) {
  const dt = new Date(d);
  return dt.getFullYear() + '-' +
    String(dt.getMonth()+1).padStart(2,'0') + '-' +
    String(dt.getDate()).padStart(2,'0');
}

function shortDay(d) {
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d).getDay()];
}

function monthDay(d) {
  const dt = new Date(d);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[dt.getMonth()] + ' ' + dt.getDate();
}

function fullDate(d) {
  const dt = new Date(d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return days[dt.getDay()] + ', ' + months[dt.getMonth()] + ' ' + dt.getDate();
}

document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
  try {
    const resp = await fetch(WEB_APP_URL);
    const data = await resp.json();
    allDocents = data.docents || [];
    allSlots = data.slots || [];

    // Populate the header dropdown
    const sel = document.getElementById('docent-select');
    sel.innerHTML = '<option value="">-- Pick your name --</option>';
    allDocents.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (name === currentDocent) opt.selected = true;
      sel.appendChild(opt);
    });

    render();
  } catch (err) {
    document.getElementById('app').innerHTML =
      '<div class="message message-error">Could not load schedule. Please try refreshing.</div>';
  }
}

function render() {
  const app = document.getElementById('app');

  if (!currentDocent) {
    app.innerHTML = '<div class="message message-info">Pick your name above to see the schedule and sign up for tours.</div>';
    removeSaveBar();
    return;
  }

  // Categorize
  const openSlots = allSlots.filter(s => s.status === '' || s.status === 'Open');
  const needsSubSlots = allSlots.filter(s => s.status === 'Needs Sub');
  const assignedSlots = allSlots.filter(s => s.status === 'Assigned');
  const myTours = assignedSlots.filter(s => s.assigned.indexOf(currentDocent) !== -1);

  // Restore selections
  selectedSlots = new Set();
  openSlots.forEach(s => {
    if (s.signups.indexOf(currentDocent) !== -1) selectedSlots.add(s.slotId);
  });

  let html = '<div id="message-area"></div>';

  // Tabs
  html += '<div class="tabs">';
  html += '<div class="tab' + (activeTab === 'calendar' ? ' active' : '') + '" onclick="switchTab(\'calendar\')">Weekly Calendar</div>';
  html += '<div class="tab' + (activeTab === 'mytours' ? ' active' : '') + '" onclick="switchTab(\'mytours\')">Your Tours' +
           (myTours.length ? ' <span class="badge">' + myTours.length + '</span>' : '') + '</div>';
  if (needsSubSlots.length > 0) {
    html += '<div class="tab' + (activeTab === 'subs' ? ' active' : '') + '" onclick="switchTab(\'subs\')">Needs Sub <span class="badge">' + needsSubSlots.length + '</span></div>';
  }
  html += '</div>';

  if (activeTab === 'calendar') {
    html += renderCalendar(openSlots, assignedSlots, needsSubSlots);
  } else if (activeTab === 'mytours') {
    html += renderMyTours(myTours);
  } else if (activeTab === 'subs') {
    html += renderNeedsSub(needsSubSlots);
  }

  app.innerHTML = html;

  // Save bar for calendar tab
  if (activeTab === 'calendar' && openSlots.length > 0) {
    showSaveBar();
  } else {
    removeSaveBar();
  }
}

function renderCalendar(openSlots, assignedSlots, needsSubSlots) {
  const weekEnd = addDays(currentWeekStart, 6);
  const today = new Date(); today.setHours(0,0,0,0);

  // Build slot map by date
  const slotsByDate = {};
  [...openSlots, ...assignedSlots, ...needsSubSlots].forEach(s => {
    if (!slotsByDate[s.date]) slotsByDate[s.date] = [];
    slotsByDate[s.date].push(s);
  });

  let html = '';

  // Week nav
  html += '<div class="week-nav">';
  html += '<button onclick="prevWeek()">&#8592; Prev</button>';
  html += '<span class="week-label">' + monthDay(currentWeekStart) + ' &ndash; ' + monthDay(weekEnd) + '</span>';
  html += '<button onclick="nextWeek()">Next &#8594;</button>';
  html += '</div>';

  // Calendar grid
  html += '<div class="calendar">';

  // Day headers
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  dayNames.forEach(d => { html += '<div class="cal-header">' + d + '</div>'; });

  // Day cells
  for (let i = 0; i < 7; i++) {
    const day = addDays(currentWeekStart, i);
    const dk = dateKey(day);
    const isToday = dk === dateKey(today);
    const daySlots = slotsByDate[dk] || [];

    // Sort by time
    daySlots.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

    html += '<div class="cal-day' + (isToday ? ' today' : '') + (daySlots.length === 0 ? ' empty' : '') + '">';
    html += '<div class="cal-day-number">' + shortDay(day) + ' ' + (day.getMonth()+1) + '/' + day.getDate() + '</div>';

    daySlots.forEach(slot => {
      const isOpen = slot.status === '' || slot.status === 'Open';
      const isAssigned = slot.status === 'Assigned';
      const isYours = isAssigned && slot.assigned.indexOf(currentDocent) !== -1;
      const isSub = slot.status === 'Needs Sub';
      const checked = selectedSlots.has(slot.slotId);

      let pillClass = 'open';
      if (isYours) pillClass = 'assigned-you';
      else if (isAssigned) pillClass = 'assigned';
      else if (isSub) pillClass = 'needs-sub';

      let shortType = slot.tourType
        .replace('Permanent Collection', 'Perm')
        .replace('Carnegie International', 'CI')
        .replace('Mindful Museum', 'MM')
        .replace('CI Activation Tour', 'CI Act')
        .replace(' Evening', ' Eve');

      html += '<div class="tour-pill ' + pillClass + '" title="' + escapeHtml(slot.tourType) + ' - ' + escapeHtml(slot.time) + '">';

      if (isOpen) {
        html += '<input type="checkbox" value="' + slot.slotId + '"' + (checked ? ' checked' : '') + ' onchange="toggleSlot(this)">';
      }

      html += '<span class="pill-time">' + escapeHtml(slot.time || '') + '</span> ';
      html += '<span class="pill-type">' + escapeHtml(shortType) + '</span>';

      if (isYours) html += ' <span style="font-size:0.65rem">YOU</span>';
      if (isSub) html += ' <span style="font-size:0.65rem;cursor:pointer" onclick="claimSlot(\'' + slot.slotId + '\', this)">CLAIM</span>';

      html += '</div>';
    });

    html += '</div>';
  }

  html += '</div>';
  return html;
}

function renderMyTours(myTours) {
  if (myTours.length === 0) {
    return '<div class="empty-state">You have no assigned tours yet. Sign up on the calendar and the system will assign you automatically.</div>';
  }

  let html = '';
  myTours.forEach(slot => {
    html += '<div class="list-card your-tour">';
    html += '<div class="lc-info">';
    html += '<div class="lc-tour">' + escapeHtml(slot.tourType) + '</div>';
    html += '<div class="lc-date">' + escapeHtml(slot.dateDisplay) + ' at ' + escapeHtml(slot.time) + '</div>';
    html += '<div class="lc-meta">Check your calendar for reminders</div>';
    html += '</div>';
    html += '</div>';
  });
  return html;
}

function renderNeedsSub(needsSubSlots) {
  if (needsSubSlots.length === 0) {
    return '<div class="empty-state">No openings right now.</div>';
  }

  let html = '';
  needsSubSlots.forEach(slot => {
    html += '<div class="list-card sub-needed">';
    html += '<div class="lc-info">';
    html += '<div class="lc-tour">' + escapeHtml(slot.tourType) + '</div>';
    html += '<div class="lc-date">' + escapeHtml(slot.dateDisplay) + ' at ' + escapeHtml(slot.time) + '</div>';
    html += '</div>';
    html += '<button class="btn btn-claim" onclick="claimSlot(\'' + slot.slotId + '\', this)">Claim</button>';
    html += '</div>';
  });
  return html;
}

// ============================================================
// ACTIONS
// ============================================================
function selectDocent(name) {
  currentDocent = name;
  render();
}

function switchTab(tab) {
  activeTab = tab;
  render();
}

function prevWeek() {
  currentWeekStart = addDays(currentWeekStart, -7);
  render();
}

function nextWeek() {
  currentWeekStart = addDays(currentWeekStart, 7);
  render();
}

function toggleSlot(checkbox) {
  if (checkbox.checked) {
    selectedSlots.add(checkbox.value);
  } else {
    selectedSlots.delete(checkbox.value);
  }
}

function showSaveBar() {
  let saveBar = document.getElementById('save-bar');
  if (!saveBar) {
    saveBar = document.createElement('div');
    saveBar.id = 'save-bar';
    saveBar.className = 'save-bar';
    document.body.appendChild(saveBar);
  }
  saveBar.innerHTML = '<button class="btn btn-primary" id="save-btn" onclick="saveSignups()">Save My Availability</button>';
  saveBar.style.display = 'block';
}

function removeSaveBar() {
  const bar = document.getElementById('save-bar');
  if (bar) bar.style.display = 'none';
}

async function saveSignups() {
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'signup',
        docent: currentDocent,
        slots: Array.from(selectedSlots)
      })
    });
    const result = await resp.json();
    if (result.ok) {
      showMessage('Your availability has been saved.', 'success');
      await loadData();
    } else {
      showMessage(result.error || 'Something went wrong. Please try again.', 'error');
    }
  } catch (err) {
    showMessage('Could not save. Check your internet connection and try again.', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Save My Availability';
}

async function claimSlot(slotId, el) {
  if (!confirm('Claim this tour? You will receive a calendar invite.')) return;

  if (el.tagName === 'BUTTON') { el.disabled = true; el.textContent = 'Claiming...'; }

  try {
    const resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        action: 'claim',
        slot: slotId,
        docent: currentDocent
      })
    });
    const result = await resp.json();
    if (result.ok) {
      showMessage('Tour claimed! A calendar invite is on its way.', 'success');
      await loadData();
    } else {
      showMessage(result.error || 'Could not claim. Someone may have gotten there first.', 'error');
      await loadData();
    }
  } catch (err) {
    showMessage('Could not claim. Please try again.', 'error');
  }
}

function showMessage(text, type) {
  const area = document.getElementById('message-area');
  if (!area) return;
  area.innerHTML = '<div class="message message-' + type + '">' + escapeHtml(text) + '</div>';
  setTimeout(() => { area.innerHTML = ''; }, 5000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
